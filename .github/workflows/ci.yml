name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --locked
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: player/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --workspace --release --locked
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci --prefix player
      - run: npm run build --prefix player
      - run: npx --prefix player playwright install --with-deps chromium
      - run: npm test --prefix player
      - run: npm run test:ingestion --prefix player
      - run: npm run test:native --prefix player
      - run: npm run test:e2e --prefix player
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - run: npx --prefix website playwright install --with-deps chromium
      - run: npm test --prefix website
