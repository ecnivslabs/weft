[workspace]
members = ["crates/weft", "crates/weft-media", "crates/weft-cli", "crates/weft-wasm", "website/server"]
default-members = ["crates/weft", "crates/weft-media", "crates/weft-cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE"
repository = "https://github.com/ecnivslabs/weft.git"

[workspace.dependencies]
weft = { path = "crates/weft", version = "0.4.0" }
weft-media = { path = "crates/weft-media", version = "0.4.0" }
serde_json = "=1.0.151"
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
