<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weft player</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/player.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-theater" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></symbol>
  </svg>
  <header class="site-header page-width"><a class="wordmark" href="/">Weft</a></header>
  <main class="page-width">
    <div data-ui id="player" class="player controls-visible" tabindex="0" role="region" aria-label="Video player">
      <canvas id="picture" width="256" height="144" aria-label="ASCII video"></canvas>
      <button id="surface" class="player-surface" aria-label="Play video"></button>
      <div id="player-message" class="player-message" role="status">
        <svg class="empty-film icon"><use href="#i-film"/></svg>
        <p id="message-text">Loading SCI sample</p>
        <button id="retry" class="button" hidden>Try again</button>
      </div>
      <button id="big-play" class="big-play" aria-label="Play video" hidden><svg class="icon"><use href="#i-play"/></svg></button>
      <div id="feedback" class="feedback" aria-live="polite" hidden></div>
      <div id="settings" class="settings-panel" aria-label="Player settings" hidden>
        <div class="settings-heading"><strong>Playback settings</strong><button id="close-settings" class="icon-button" aria-label="Close settings"><svg class="icon"><use href="#i-close"/></svg></button></div>
        <label>Quality<select id="resolution"><option value="auto">Auto</option></select></label>
        <label>Playback speed<select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
        <label>Frame rate<select id="frame-rate"><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select></label>
      </div>
      <div class="player-controls">
        <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek video" disabled>
        <div class="control-row">
          <button id="play" class="icon-button" aria-label="Play (K)" title="Play (K)" disabled><svg class="icon"><use href="#i-play"/></svg></button>
          <button id="mute" class="icon-button" aria-label="Mute (M)" title="Mute (M)"><svg class="icon"><use href="#i-volume"/></svg></button>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
          <span id="time" class="time">0:00 / 0:00</span>
          <span class="control-spacer"></span>
          <button id="settings-toggle" class="icon-button" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
          <button id="theater" class="icon-button" aria-label="Theater mode (T)" aria-pressed="false" title="Theater mode (T)"><svg class="icon"><use href="#i-theater"/></svg></button>
          <button id="fullscreen" class="icon-button" aria-label="Fullscreen (F)" title="Fullscreen (F)"><svg class="icon"><use href="#i-fullscreen"/></svg></button>
        </div>
      </div>
    </div>
    <h2 id="video-title">Cartoon sample</h2>
    <p id="video-details"></p>
    <a id="download-sample" href="/sample.sci" download>Download .sci</a>
  </main>
</body>
</html>
